name: myapp
description: "A high-fidelity music streaming application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  youtube_explode_dart: ^2.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  firebase_core: ^4.7.0
  firebase_ai: ^3.11.0
  supabase_flutter: ^2.12.4
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
